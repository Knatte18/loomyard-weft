verdict: hand-on
reason: |-
  Round 2 stopped at the hard cap with two open design-wrong findings, F1 (mistyped-buttons-group-fails-config-loads) and F2 (nonzero-exit-opens-view-mode). The round-2 fixer changed decision-record.md after the review, so I read both fixes against the code.

  F2 is answered. D7 now says the pinned line, on the click line and the confirmed line alike, ends with a forced zero status in reed's pane shell dialect (decision-record.md:115). D7 also says the discarded output and the forced zero status together keep view mode shut (decision-record.md:120).

  F1 is only partly answered. Two of the fix's claims hold against the code:
  - A group written as a mapping loads in reed's layers and desktop's hub file with no load-time Warn, because pruneMapping records no removed key when a mapping meets a sequence template (internal/yamlengine/layers.go:396-425).
  - A non-empty mapping group in desktop's machine layer is refused, because its leaf path is absent from the template (internal/configengine/layers.go:341-344).

  The fix also added a claim that is false: "so does an empty mapping in desktop's machine layer" (decision-record.md:50). That clause says an empty mapping group loads there and is skipped at render. In fact desktop's spec sets no WholeEntries and no OpenMaps (internal/desktophook/config.go:35-44). So LeafPaths returns `buttons.task` itself for `task: {}`, since unitPaths does not descend an empty mapping (internal/yamlengine/layers.go:505-509). templateValueAt then finds the template's sequence `[]`. ValidateMachine refuses the mismatch with "the desktop template holds a different shape" (internal/configengine/layers.go:345-347).

  So an empty mapping group fails desktop's load exactly as a non-empty one does. D2 still misstates which shapes the machine layer refuses, the very subject of F1, at decision-record.md:50, :51 ("non-empty mapping") and :57 ("non-empty mapping"). The fix in place does not answer F1, and the finding is not wrong, so the hard-cap rule rules out an accept.

  The defect is a one-clause correction. But I may edit nothing beyond this verdict, and no recorded operator decision covers it.
