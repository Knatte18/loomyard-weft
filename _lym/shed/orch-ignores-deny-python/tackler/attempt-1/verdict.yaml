verdict: resume
reason: >-
  The stop is a producer refusal at Open-IDE (trace 663e00a8cd7e74e5, step envelope drive-envelope-20261118-083834-dcf3.json). Its push of the records side at loomyard-weft was held back because the push job's origin check judged branch main-weft gone from origin and its entry ended (internal/fabricengine/pushclassified.go checkOrigin / awaitOrigin / goneEntryEnded). The named cause is the origin lookup at push time, not the commit content. Read now, origin does hold the branch: git ls-remote origin refs/heads/main-weft returns 34b476738c933946ad51213a537c44dcfee2689d. The stop commit 16d8fd32794b34def244479625709dd92da02b05 is an ancestor of that tip and of the local main-weft tip 6a1e09b26c (git merge-base --is-ancestor, exit 0 both). The remote tip is an ancestor of local, so a re-run's push is a fast-forward. With the branch present, the gone-and-ended branch of checkOrigin does not apply, so a plain re-launch of Open-IDE should settle the stop. Caveat for the run's parent: goneEntryEnded derived the slug "main" from branch main-weft and reported its entry ended. That judgement looks wrong for the hub's main branch and would recur if origin ever lacks main-weft again. It is not a reason to hand back this stop.
