verdict: resume
reason: |-
  Error stop at Seed-Child, before the row's own work ran. The failing push was the hub
  records push of the status commit 34b476738c "batten: Seed-Child -> running" on main-weft
  in loomyard-weft (step trace line at 08:38:27.897, refusal at 08:38:39.047).
  That commit has landed since: git merge-base --is-ancestor 34b476738c origin/main-weft
  exits 0, and ls-remote shows main-weft on origin (now at 58f949b243). The run's own pair
  is intact and clean: refusal-names-segment and refusal-names-segment-weft both track
  their origin branches with nothing unpushed and nothing uncommitted (the weft holds only
  the untracked _lym/usage/). status.json records Worktree-Create done and Seed-Child failed
  with no further history, so no Seed-Child output exists to collide with on a re-run.
  The message comes from the generic fallback of recordsSideNotLanded
  (internal/fabricengine/pushanchored.go:297-310), which fires whenever HasUnpushed is still
  true after a nil records push. main-weft is shared by every batten run on this hub, and
  other runs committed to it in the same seconds (c407f429 Open-Window at 08:38:38,
  b01637f87d at 08:38:55), so a racing writer or a racing origin read left the branch
  "unpushed" at the check; it is not a ledger ending of this run's entry. That is a hub
  fabricengine defect outside this task's scope (the task is the shell guard's refusal
  text), so I made no fix; it is worth its own board entry. A plain re-launch re-runs
  Seed-Child against a landed records branch and is safe.
