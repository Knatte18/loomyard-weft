verdict: resume
reason: >-
  The stop is a known transient fabric bug, not a real end of the branch. At 11:34:54 the Seed-IDE records push
  to main-weft was classified by recordsSideNotLanded (internal/fabricengine/pushanchored.go:297-310) as "entry ended
  on origin", although main-weft is never ended. The board records the same bug as T5 records-push-main-weft-ended
  (_bolt board.json, entry "records-push-main-weft-ended"; its body says a rerun passes and the orch's workaround was
  to rerun `lym batten run <slug>`). The stop is not a true loss of the work: the stop commit 02041e40be (batten:
  Seed-IDE -> running) is an ancestor of origin's main-weft tip 05b14823b2 (checked with merge-base --is-ancestor),
  and git ls-remote returned a line for refs/heads/main-weft, so the branch is present. The stop is a producer error
  on its first stop with no prior resume, so a plain re-launch is the documented fix. No goto is needed.
