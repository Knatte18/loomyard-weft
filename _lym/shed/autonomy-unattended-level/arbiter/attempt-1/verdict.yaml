question: |-
  F7 (LOW, decision): the halt notices that loom and batten post through NotifyParentHalt and NotifyRunFromHalt stamp a run's autonomy through hubgeom.Autonomy, which drops the refusal.
  So the orch hears of a refused beam.autonomy value only when the dobby builds one of its own stamped mails about the run.
  Under beam.run_watch off, a run whose halts come only from loom or batten is stamped false, and its refusal is never posted.
  D1 says the dobby posts the refusal once per episode so a mistyped level does not pass unseen, but it does not say whether that covers this case. Which design do you choose?
  (A) Accept the gap. The halt is still relayed under false, the level at which the orch asks the operator. The fixer adds one sentence to the runAutonomyStamps doc in internal/beamcli/dobbydeps.go saying a refusal is told only once the dobby stamps one of its own mails about the run.
  (B) Build it. The dobby checks each listed run's value on its own tick, whether or not it posts a mail, and posts through the same runAutonomyStamps episode.
  The scope is closed. If you rule this part of D1, use lym loom circling continue autonomy-unattended-level --in-scope F7 with your chosen option, since round 1 is below the hard cap. Otherwise file the call as a board note and continue without F7.
  Either way, continue rather than accept, because the judge's verdict is CONTINUE.
  The BLOCKING finding F1 is already fixed by commit 5719520f9, and F3 and F4 are reported fixed, so round 2 re-reviews them.
