verdict: resume
reason: |-
  Review escalation at round 3, cause hard-cap: the round is at the hard cap, so the segment can only be accepted,
  and the arbiter accepts only when the fix in place answers each open design-wrong finding.
  It does for all four. F1 (no owner of a machine-outbound message's hour): D3 now names a scheduler timer,
  one hour from the post, armed by the post and the start scan, running without the relay, and take never returns a message past its hour,
  with an injected-clock criterion. F2 (impossible rename of an archived channel): D4 now says unarchive (adopt when either bot made it)
  or unarchive then rename (anyone else made it), with the conversations.rename is_archived evidence and an updated criterion.
  F3 (journal form of report and settle): D3 names machine-held written only on a changed reason, machine-delivered with the Slack timestamp,
  machine-returned, an idempotent late settle and older binaries folding them to nothing, with criteria.
  F4 (home of notice marks, cursor after approval): D4 adds a bridge-notice record keyed by pair or channel id that survives a map drop,
  and D8 moves the delivery cursor past what an approval delivers, with restart and approve-then-revoke criteria.
  The ruling is recorded as an arbiter decision, which also settles the one residue phrase, D3's "only reader", as the relay's only reader.
verbs:
  - |-
    lym loom decision add slack-machine-bridge --by arbiter --title "Round 3 hard-cap ruling: the four open findings are answered in the record" --decision "…" --rationale "…"
  - |-
    lym loom circling accept slack-machine-bridge
