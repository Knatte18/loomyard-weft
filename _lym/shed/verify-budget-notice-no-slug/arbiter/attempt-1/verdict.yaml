  The seat label is built from this run's slug and the seat name, so a plain re-launch at the same pane width fails the same way.
  The fix belongs in the shuttle engine's readiness parser. That is outside this task's code (the verify-budget notice in loomshed/loomcli), and neither the board entry nor the decision record settles it.
  So it is not my fix to make. This error stop has no repair verbs and I recorded nothing.
