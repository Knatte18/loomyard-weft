reason: |-
  This is a blocked error stop at the Webster row, with no review escalation and no case brief, so the arbiter has no repair verb here.
  Webster's run-exit audit left one correctness finding pending: parent-write, Master wrote _lym/loom/friction/webster-master.md.
  That write was sanctioned. RenderMasterPrompt (internal/websterengine/render.go) injects friction.RoleOrchestrator's directive,
  and the friction-directive-orchestrator stencil tells Master to write its optional friction note at exactly that note path.
  The audit's parent-write class (internal/websterengine/audit.go) allows only outcome.yaml and summary.md and does not exempt the friction note path.
  So the finding is a false positive caused by a webster engine defect, not by this task's work.
  The note itself is harmless: it records that card 11 was too large and lists packages that may still have bare key names, which is useful for review.
  The run had otherwise finished: outcome.yaml says done with 8 of 8 batches done, HEAD is 57513a969 after the verify-gate fix commit, and the worktree is clean.
  A plain re-launch or a goto to Webster would only hit the same pending finding again.
  The audit's own way forward, lym webster reset --to start, would throw away every batch the run built.
  lym webster accept-audit refuses a path that "cannot be checked", and this path is outside the task worktree, so it would refuse too.
  None of those verbs is mine to run anyway, and fixing the audit's exemption is outside this task's scope.
  I made no commit and no decision.
