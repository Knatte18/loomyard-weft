  changes that template, so this is a scope or design choice, not a resume.
  The stop's "gate did not pass after 4 attempts" message is the same failure
  as the red-first gate, not a separate fault.
question: >-
  The red-first gate refuses the Darn-Write diff because it changes
  contracts/stencils/darn/darn-template-write.md, which the overlay cannot put
  back on the base, so no test in this run can be shown to fail before the fix.
