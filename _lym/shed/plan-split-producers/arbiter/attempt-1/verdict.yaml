question: |-
  Discussion-Bouncer for plan-split-producers is at the hard cap (round 2). Every open design-wrong finding has a fix in the decision record, but F3's fix changes the chair stencil. D12 (decision-record.md:239) now lets the chair read the code of a part's area when it fixes that part itself. D9 makes that the path for a part whose writer no longer answers after a resume, the normal case after any reinvoke. The board's operator stencil rule says "the chair reads cards, not code, beyond what the shared spots need", and your earlier approval covered D12 before this change.
  Which do you want?
  1) Approve the D12 exception as written (the chair reads only the code of that part's area, and only when it fixes the part itself), then record it and run `lym loom circling accept plan-split-producers`.
  2) Keep the chair on cards only: a part whose writer no longer answers and whose fix is outstanding at a resume ends the row Stuck, naming the part, so a rerun writes it again. This needs D9 and D12 amended before accepting.
  Also confirm that adding a creel daemon request for D8's chair-only caller check, a change to internal/creelengine, is within this task's scope.
