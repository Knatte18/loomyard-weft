verdict: resume
reason: |-
  Round 1 of Code-Bouncer escalated with cause decision. Its only decision finding is F11, and there is no refusal and no BLOCKING finding.
  F11 asks whether below-window-accept-blocking needs the run to ask the parent below the soft-cap window.
  The board entry names the harm as a run landing past an open BLOCKING finding without the parent.
  At the base, holdAcceptOverOpenEntries (internal/shedadapters/bouncerdecision.go) passes nothing below the window: it starts another round.
  Inside the window it retires the accept and escalates with cause budget, which only the parent accepts.
  So the harm cannot occur.
  The task's main entry also aims to ask the parent only when a BLOCKING finding stays open after the fix and the check.
  So the board entry settles F11 as needing no change, and I recorded that as an arbiter decision.
  The answer needs no fix, so I accepted the round.
  The open design-wrong finding F1 is answered by the fix in place (commit 37727ca0b).
  closeVerifiedBlocking now closes a key only when the verification maps it to a finding that fixedBlockingFindings returned.
