      ],
      "contract": {
        "takes": "testmap-verb's verb",
        "delivers": "per the operator's decision after the Motif (2026-11-08, in the Sketch's board body), which replaces D6's trigger and supersedes the trigger clauses of the first carried criterion: a dobby tick step on the prime dobby that counts landings as the board tidy does and, after every test_map_every landings, starts `lym gate testmap --max <test_map_batch>` on the packages stale then, leaving what the cap left unbuilt for the next refresh; no prime-HEAD record and no exit-record trigger; started through a spawn dep registered as runproc.RoleTestMap under runproc.HubOwner, none while a live test-map record exists, a restarted dobby included; the child ended on stop through runproc.EndRole; dobby config keys test_map_every beside board_tidy_every, where 0 never refreshes, and test_map_batch; no test_map on/off key",
        "exports": "runproc.RoleTestMap"
      },
      "depends_on": ["testmap-verb"],
      "open_risks": [],
      "criteria": [
        "D6: the dobby starts a refresh when the prime HEAD differs from its record, when D5's exit record names the refresh it waited on and a count of stale packages the cap left unbuilt above zero, or on its first tick.\nIt starts none when the prime HEAD is unchanged and the last refresh only skipped packages, none while a live `test-map` record exists, a restarted dobby included, and none when `test_map` is off.\nAt an unchanged prime HEAD it starts none for a refresh that was killed or whose exit record is missing or names another process.",
        "D6: a dobby stop ends a running refresh through `runproc.EndRole` with `runproc.RoleTestMap` (new)."
      ],
      "pattern_changes": [],
      "expected_cost_usd": 3.27,
      "cost_line": "darn/light stored-record fit over 10 runs: $2.14 fixed plus $0.39 per 100 lines at about 290 lines (correlation 0.73)"
    },
    {
      "slug": "gate-redundancy-report",
      "title": "An advisory redundancy report step in lym gate test, judging a diff's new tests against the map",
      "type": "feature",
      "recipe": "darn",
      "profile": "solid",
      "decisions": ["D7"],
      "packages": [
        {"path": "internal/gatecli", "size": 800},
        {"path": "internal/gateslot", "size": 150},
        {"path": "internal/configengine", "size": 30},
        {"path": "internal/testcover", "size": 120}
      ],
      "contract": {
        "takes": "testcover-engine's engine and map record; testmap-verb's CodeDirAt, CodeFileAt, timeouts and run-alone",
        "delivers": "the `reports` list on gate keys with its unknown-name refusal and template entries on webster, parent-align, darn-write and code-burler-fix; the step at the lints' site with merge-base test selection, drops, cap, slot, budget, map covers, greedy pass and the report with its file and test hashes; keys redundancy_max_tests and redundancy_budget_min",
        "exports": "the report reader and the tree match D8 runs on HEAD: D7 step 1 over a revision and the judged packages' file hashes"
      },
      "depends_on": ["testmap-verb"],
      "open_risks": [],
      "criteria": [
        "D7: a new test whose blocks are all covered by unchanged map tests is reported contained, naming those tests.",
        "D7: a test covering a block of an edited function that no map test and no other judged test covers is reported unique.",
        "D7: a judged test is never its own cover, and a covering map test whose function text changed since the map is not counted.",
        "D7: two judged tests covering only each other's blocks are never both reported contained.",
        "D7: a changed test is found by its function text at the merge base, read through `fabricengine.CodeFileAt` (new); a worktree with no parent branch judges nothing and its report says so.\nA test file renamed or moved within its package leaves its unchanged tests untaken, and a deleted test file adds none.",
        "D7: a `//testtiming:keep` test with its keep reason, a `tier2` test, a test of an undeclared tier, tests past `redundancy_max_tests`, a timed-out test, a test left unrun once `redundancy_budget_min` is spent, and a test that was skipped, failed or covered no block in the step's run are listed as not judged with their reasons.\nOnce the budget is spent no further coverage build starts.",
        "D7: a package without a map, or whose map records a build failure, is reported as not judged; every judged package's line names its map commit and age,\nand one whose file hashes differ is judged and its line also names the files whose text at the merge base differs from the map.",
        "D7: a build failure, a failing or timed-out test, an unreadable or corrupt map, an unreadable merge base or a failed `lym` build in the step is a report line and leaves the gate's result as its tiers decided it.\nA failed report write is logged and leaves the result too, and a red tier gives a report that judges nothing.",
        "D7: a second call on a tree its report matches runs no build and no test, unless the report holds an error line, a package with no map or a failed-build map, or a test past the budget,\nincluding when the diff also changes a `tier2` test.",
        "D7: an unknown report name in a gate key is refused with the known names.",
        "D7: a hub base `gate.yaml` that sets `webster` without `reports` loads with the template's `reports: [redundancy]` on it, and one that sets `reports: []` loads with none.",
        "D7: on a hub whose `scoper` is not `go`, the step judges nothing and its report says so."
      ],
      "pattern_changes": [],
      "expected_cost_usd": null,
      "cost_line": "darn/solid with a stored record reads too few runs (2 runs), so no figure; about 1,100 changed lines"
    },
