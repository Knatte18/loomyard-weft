      "title": "The prime parent's dobby starts lym gate testmap after every test_map_every landings",
      "type": "feature",
      "recipe": "darn",
      "profile": "light",
      "decisions": ["D6"],
      "packages": [
        {"path": "internal/dobbyengine", "size": 200},
