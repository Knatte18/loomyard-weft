      "cost_line": "tapestry solid stored_record true fit (6 runs, correlation 0.93) at $31.63 fixed plus $0.44 per 100 lines over about 4,650 changed lines reads about $52, against a $64.84 mean; about 670 lines deleted besides (the lock-free pass, the lost-race loop and finalize_unlocked_test.go). One tapestry because the queue entry and move mark (landingqueue's types) and fabric's chain-commit interface are one shape the leader, the backstop in lym fabric anchor, the resume restore and the pusher's hold-off all read, which a single plan must fix; no seam lands whole, since the queue store, the chain verb and the detached checkout have no production caller but the leader, and a leader without D7's bisection or D8's outcomes would need a failed-batch behaviour no decision gives. Solid because the leader lands other runs' work on the parent and writes their ledger landings. D11 and D12 ride here so doc.go and PATTERN-landing change with the code they describe. Edge on fabric-core-push-origin (running), which moves pusherreads' rules into fabriccore where D5's hold-off sits. Edges left out: fabric-core-merge-landing and keep-landed-run-records (released), since the record's Constraints have fabric-core-merge-landing move this part's verbs, so both follow it; fabric-core-teardown (released) changes fabricengine's and fabriccli's remove, cleanup, prune and archive files, apart from the merge, pusher and anchor files this part changes; clone-reset-keeps-unpushed (running) changes fabricengine's clone files and fabriccli's clone verb; kde-window-placement-build (running) adds lines to lymdirs/dirs.go, docs/overview.md and other pattern/ files; autonomy-unattended-level (running) changes loomcli's drift and pawl wiring; the jacquard drafts, not yet released, change loomcli's decision, bootstrap and recipe-list files and one glossary line apart from this part's; each overlap is a few lines that merge by hand. D6's Backstop names lym fabric pull as a lock taker, but it takes no parent lock today, so the backstop runs at a run's lock take and lym fabric anchor's."
    }
