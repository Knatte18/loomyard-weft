types: # type labels with their descriptions: a note carries exactly one, a task one or more
    bug: lym does something wrong
    enhancement: something lym already does gets cheaper, clearer or sturdier, with no new capability
    feature: lym gains something it cannot do today
    research: a measurement, bench or study; runs as darn with profile docs, never as loom
labels:
    board: the task tracker, lym board
    config: config files under _lym/config and their loading
    ide: VS Code integration, lym ide
    reed: the tmux server, sessions and strands
    fabric: warp/weft pairs and their git verbs
    selfreport: anomalies lym files about itself
    shuttle: launching and driving agent sessions
    burler: review rounds
    webster: plan execution by cards and batches
    stencil: prompt templates for spawned roles
    loom: the task recipe from Discussion to Finalize
    quarry: the code index and glyphs
    batten: the outer run lifecycle around a loom
    shed: the phase machine, its recipes and drivers
    orch: the hub orchestrator session
    creel: the message layer every agent, program and operator uses to reach an agent
    claude: the Claude Code engine, shuttleengine/claudeengine and its config
    codex: the Codex CLI engine and its config
    report: 'lym report: read-only reports over the hub records and history (internal/reportengine)'
    workspaces: 'umbrella tasks: project worktrees with their own orch thread, VS Code workspaces and pairs under them'
    deploy: update-plugins.sh, deploy-dev and the prod pointer (tools/deploy)
    dotnet: 'support for .NET/C# hubs: gate, verify tiers, scoping and baselines for a C# repository such as NORCE Models'
    gate: lym gate test, the gate-slot pool and the verify test tiers
    testkit: the shared test helpers under internal/testkit
    pattern: PATTERN.md, its pattern/ background files and their checks (internal/pattern)
    shortcut: the top-level shortcut verbs, internal/shortcutcli
    dobby: the hub daemon that starts, drives, lands and cleans up runs (internal/dobby)
    tender: the pause, resume and revive verbs for runs, lym tender (internal/tendercli, tenderengine, pauserecord)
    hibernate: machine hibernate requests and sleep detection, lym hibernate (internal/hibernatecli, hibernateengine, sleepjournal)
    drift: regression records and comparison around a task, lym drift (internal/driftcli, driftengine)
    darn: the darn recipe, its config and verify scope (internal/darnengine)
    arbiter: the shed arbiter call and which halted stops it may settle (internal/shedarbiter, arbiterstop)
    landing: 'landing a run: Parent-Align, PR-Review, Finalize, the pull request, parent lock and pair teardown (internal/landingshed, pullrequest, parentlock, pairteardown, mergeresolve)'
    cleanup: the routine removal of leftover state in the hub prime, lym cleanup (internal/cleanupcli)
    termwindow: opening a desktop terminal window attached to a worktree (internal/termwindow)
    logger: the lym slog wrapper and trace retention (internal/logger, loggerconfig)
    git: running git and GitHub from Go (internal/gitexec, gitrepo, dotgit, githubclient)
    cwd: resolving the worktree, hub geometry, state dirs and temp root (internal/lymcwd, hubgeom, standalonegeom, standalonestate, lymdirs, lymtemp, machinename)
    friction: friction notes, halt notes and failure tracing (internal/friction, frictionengine, haltnote, failuretrace)
    lenses: the lens and fan library, twill review and lens reports (internal/lenses, lensreport, twilldirective)
    reconcile: reconciling hub config after a binary change, self re-exec and build identity (internal/hubreconcile, selfexec, buildinfo, buildvcs)
    preflight: tier-1 and tier-2 preconditions and the tool version floor (internal/preflight, preflightshed, toolfloor)
    parsers: the sole parsers of plan, discussion and summary files (internal/planparser, discussionparser, summaryparser)
    process: child-process control, run process registry and shell guards (internal/proc, runproc, shell, shellguard)
    fsutil: filesystem links, file watching, locks and typed JSON state (internal/fslink, fswatch, fsx, lock, state, envsource, yamlengine)
    cli: shared CLI plumbing, help, output, status panes and colors (internal/clihelp, helpcli, cliwire, output, statuspane, statuscommit, segmentcolor, durfmt)
    pawl: 'the pawl run: Beam-Up, Beam-Await and Beam-Down (internal/pawlengine)'
    lint: comment lint over a diff (internal/commentlint)
    profiles: run profiles and review budgets (internal/runprofile, reviewbudget, languageconfig)
    docs: the README and docs/, the repository documentation outside the code
