# profiles.yaml — the hub's named run profiles, and the profile each recipe takes by default.
# Each top-level key but defaults is a profile name, and its value holds one block per recipe, loom or darn;
# a block has the shape of a board task's run_settings: module name to that module's config keys.
# A task names a profile in its board entry's profile field, or takes its recipe's entry under defaults when it names none;
# batten's Seed-Child writes the block of the recipe the task runs into the pair's local config, with the task's own run_settings layered on top.
# Each perch's hard cap is its rounds plus one, so `lym loom circling continue` can grant one more round.
#
# Seeded once when this file is absent; after that it is operator-owned and no reconcile rewrites it.
# Add or replace a profile, or the defaults, with: lym config profiles --set <name>='<json object>'
# Remove one by deleting its block in the editor: lym config profiles

defaults:
  tapestry: solid
  darn: light
  motif: solid
  pawl: light
  raddle: light
  jacquard: solid
speed:
  tapestry: {loom: {code: {hard_max_bounces: 2, max_bounces: 1, reviewer_fan: ""}, discussion: {hard_max_bounces: 1, max_bounces: 0}}, tapestry: {plan: {hard_max_bounces: 1, max_bounces: 0}}}
  darn: {loom: {code: {hard_max_bounces: 1, max_bounces: 0, reviewer_model: 'opus[medium]'}}}
  motif:
    loom: {discussion: {hard_max_bounces: 1, max_bounces: 0}}
  pawl:
    loom: {code: {hard_max_bounces: 1, max_bounces: 0}}
  sampler:
    loom: {code: {hard_max_bounces: 1, max_bounces: 0}}
  raddle:
    loom: {raddle: {auto_approve: false}}
  jacquard:
    loom: {code: {max_bounces: 1, hard_max_bounces: 2, reviewer_fan: ""}}
    tapestry: {plan: {max_bounces: 0, hard_max_bounces: 1}}
light:
  tapestry: {loom: {code: {hard_max_bounces: 2, max_bounces: 1}, discussion: {hard_max_bounces: 2, max_bounces: 1}}, tapestry: {plan: {hard_max_bounces: 2, max_bounces: 1}}}
  darn: {loom: {code: {hard_max_bounces: 2, max_bounces: 1, reviewer_model: 'opus[medium]'}}}
  motif:
    loom: {discussion: {hard_max_bounces: 2, max_bounces: 1}}
  pawl:
    loom: {code: {hard_max_bounces: 2, max_bounces: 1}}
  sampler:
    loom: {code: {hard_max_bounces: 2, max_bounces: 1}}
    sampler: {code_review: true}
  raddle:
    loom: {raddle: {auto_approve: false}}
  jacquard:
    loom: {code: {max_bounces: 1, hard_max_bounces: 2}}
    tapestry: {plan: {max_bounces: 1, hard_max_bounces: 2}}
solid:
  tapestry: {loom: {code: {hard_max_bounces: 2, max_bounces: 1}, discussion: {hard_max_bounces: 3, max_bounces: 2}}, tapestry: {plan: {hard_max_bounces: 3, max_bounces: 2}}}
  darn: {loom: {code: {hard_max_bounces: 3, max_bounces: 2, reviewer_model: 'opus[medium]'}}}
  motif:
    loom: {discussion: {hard_max_bounces: 3, max_bounces: 2}}
  pawl:
    loom: {code: {hard_max_bounces: 3, max_bounces: 2}}
  sampler:
    loom: {code: {hard_max_bounces: 3, max_bounces: 2}}
    sampler: {code_review: true}
  raddle:
    loom: {raddle: {auto_approve: false}}
  jacquard:
    loom: {code: {max_bounces: 1, hard_max_bounces: 2}}
    tapestry: {plan: {max_bounces: 2, hard_max_bounces: 3}}
wide:
  tapestry: {loom: {code: {hard_max_bounces: 2, max_bounces: 1}, discussion: {hard_max_bounces: 4, max_bounces: 3}}, tapestry: {plan: {hard_max_bounces: 3, max_bounces: 2}}}
  darn: {loom: {code: {hard_max_bounces: 4, max_bounces: 3, reviewer_model: 'opus[medium]'}}}
  motif:
    loom: {discussion: {hard_max_bounces: 4, max_bounces: 3}}
  pawl:
    loom: {code: {hard_max_bounces: 4, max_bounces: 3}}
  sampler:
    loom: {code: {hard_max_bounces: 4, max_bounces: 3}}
    sampler: {code_review: true}
  raddle:
    loom: {raddle: {auto_approve: false}}
  jacquard:
    loom: {code: {max_bounces: 1, hard_max_bounces: 2}}
    tapestry: {plan: {max_bounces: 2, hard_max_bounces: 3}}
docs:
  darn: {darn: {writer: 'sonnet[medium]', report_dir: "docs/research"}, loom: {code: {hard_max_bounces: 1, max_bounces: 0, reviewer_fan: "", reviewer_model: 'opus[medium]'}}, drift: {scope: "off"}}
