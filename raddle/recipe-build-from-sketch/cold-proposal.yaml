      "cost_line": "darn solid with stored_record true reads too few runs (no run yet), so no figure; about 1,325 changed lines plus about 435 deleted (tapestry's moved rows) over nine packages, two of them a few wiring lines (shedcli, testkit/envkit); the stored_record-false darn solid fit (19 runs) reads about $20 for reference only. Solid because in-flight tapestry runs resume under the new graph and the change spans shed and loom. No seam cuts it further: D3, the RecordSeed engine and the widened contract have no production caller but the rewritten recipes. Edges left out: autonomy-unattended-level (running) changes about 30 loomcli lines on hubgeom.Autonomy callers, apart from wiring.go's Env, and keep-landed-run-records (released, behind the fabric-core chain) changes shedrun's run paths, while this part adds one constant there; both merge by hand. Until jacquard-recipe-lists lands, a tapestry run's Record-Seed and Jacquard rows have no phase in lym report timing."
