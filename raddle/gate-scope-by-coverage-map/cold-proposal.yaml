  "parts": [
    {
      "slug": "testmap-cross-package",
      "title": "testmap records each test's coverage across every in-module package its binary links",
      "type": "feature",
      "recipe": "darn",
      "profile": "solid",
      "decisions": ["D2"],
      "packages": [
        {"path": "internal/testcover", "size": 300},
        {"path": "internal/gatecli", "size": 500}
      ],
      "contract": {
        "takes": "testmap and the redundancy report as they stand once testmap-upkeep's design has landed",
        "delivers": "maps whose blocks span every linked in-module package, with per-linked-package file hashes (go:embed targets in subdirectories included), each test's spawn-scan verdict and a format marker holding Commit and BuiltAt; dirty checks over every linked package's files, read fresh before the build and after the last test; the redundancy report and mapDrift unchanged in verdict",
        "exports": "testcover.Map's linked-package field, spawn verdict per test and format marker; BlockKey carrying an import path for another package's block"
      },
      "depends_on": ["testmap-upkeep"],
      "open_risks": [
        "Every existing map lacks D2's marker, so every package needs one rebuild before any selection.\ntestmap makes it by its present rules, which leave a map without the marker fresh,\nso at the latest at the age limit, or at once through a testmap call naming the package;\nthat also delays the full map set `redundancy-sweep-existing` waits on, at the pace note `testmap-backlog-drain` governs.",
        "Coverage narrows only while a map is fresh.\nBy the measured rate under Constraints, landings to `internal/fabricengine` still miss about twice a day,\nso the share of fresh maps is set by the cadence note `testmap-upkeep` governs.\nThe tasks raddle files from this record must be ordered after the task that builds `testmap-upkeep`'s design."
      ],
      "criteria": [
        "D2: testmap on a fixture module records, for a test of package B that calls into package A, A's blocks keyed with A's import path,\nA's files and hashes in their own field, an embedded file in a subdirectory of A included,\nand the format marker holding the map's `Commit` and `BuiltAt`.",
        "D2: testmap records a test the spawn scan marks out-of-process as such.",
        "D2: testmap leaves a map as fresh when only a linked package's file changed at HEAD and the map's own files and age are unchanged.",
        "D2: testmap leaves package B's map as it was while linked package A holds a modified or untracked file.",
        "D2: a linked package's file dirtied after the walk started and still dirty after a package's tests\nmakes testmap write no new map for that package and leave any earlier one as it was.",
        "D2: the redundancy report's verdict for a fixture test is the same whether the map holds cross-package blocks or not, and `mapDrift` reports no other package's file."
      ],
      "pattern_changes": [],
      "expected_cost_usd": 7.10,
      "cost_line": "darn/solid stored-record fit, $4.06 fixed + $0.38 per 100 lines over 6 runs (r 0.64), at about 800 changed lines"
    },
    {
      "slug": "coverage-test-select",
      "title": "Select an importing package's tests from its coverage map, or name the miss that runs it whole",
      "type": "feature",
      "recipe": "darn",
      "profile": "solid",
      "decisions": ["D4", "D5"],
      "packages": [
        {"path": "internal/testcover", "size": 900}
      ],
      "contract": {
        "takes": "testmap-cross-package's map shape, the working tree and fabricengine.Fabric.CodeFileAt for file content at the map's Commit",
        "delivers": "for one importing package's map: the tests selected by changed functions of linked packages per D4, or a D5 miss with its reason (map unreadable or unmarked, Commit unreadable, own files changed, non-body change, //go: line, method set, added init, predeclared name, parse failure, non-Go file change with the go:embed carve-out from inert_paths)",
        "exports": "a selector in internal/testcover returning the selected test names or a miss reason, which coverage-gate-scope calls per importing package"
      },
      "depends_on": ["testmap-cross-package"],
      "open_risks": [],
      "criteria": [
        "D4: an edit inside function F of A selects B's tests that covered a block of F and no B test that covered only other functions.",
        "D4: changing the parameter types of a plain function F of A, its body unchanged, selects B's tests that covered a block of F.",
        "D4: deleting a file of A selects every B test that covered a block of it.",
        "D4: a change to function G of A made on main after B's map was built selects B's tests that covered G,\nwhether the tier's base predates or postdates that change.",
        "D4: an edit to one of two `init` functions in a file of A selects every B test that covered a block of either.",
        "D5: each listed miss case runs the importing package whole and names the reason,\namong them a Go file with an `init` function added to A since the map's `Commit`, an edit to one of B's own test files since then,\nan edit to an embedded file in a subdirectory of A, a changed const in a linked package no B test covered a block of,\na method of A whose receiver changed from value to pointer with the same body, a changed file of A that does not parse,\nand a marker whose `Commit` and `BuiltAt` differ from the map's.",
        "D5: an edit to a comment, a reordered import block, an added const in A, or an added import of a standard-library or linked package is no miss;\na removed import, an added import of any other package, a const added to an `iota` group of A, an added function named `max` in A,\nor an added, removed or changed `//go:` directive line is a miss.",
        "D5: an edit to an embedded file of A that `inert_paths` matches is a miss."
      ],
      "pattern_changes": [],
      "expected_cost_usd": 7.48,
      "cost_line": "darn/solid stored-record fit, $4.06 fixed + $0.38 per 100 lines over 6 runs (r 0.64), at about 900 changed lines"
    },
    {
      "slug": "gate-scope-coverage",
      "title": "A coverage gate scope runs changed packages whole and importing packages' selected tests",
      "type": "feature",
      "recipe": "darn",
      "profile": "solid",
      "decisions": ["D1", "D3", "D6", "D7", "D8"],
      "packages": [
        {"path": "internal/gateslot", "size": 80},
        {"path": "internal/impactset", "size": 150},
        {"path": "internal/gatecli", "size": 750}
      ],
      "contract": {
        "takes": "coverage-test-select's selector and the diff scope as impactset.DeriveTargets and computeScope derive it",
        "delivers": "scope: coverage in gateslot and the template's darn-write, webster-fix and code-burler-fix keys; DeriveTargets keeping changed and lym-binary packages apart from importers; the D3 union per importing package and tier; a second tier invocation with an anchored -run in the run's own args, its green entry carrying them, over-budget fallback to whole; the per-package scope report; maps read only, never built",
        "exports": "the coverage scope value and impactset.Targets' split of changed packages from importers"
      },
      "depends_on": ["coverage-test-select"],
      "open_risks": [],
      "criteria": [
        "D1: a gate key with `scope: coverage` loads; the scope error for an unknown value names `coverage` among the allowed values.",
        "D1: under scoper `none` or `dotnet`, a `coverage` key computes the same targets as `diff`.",
        "D1: a package `diff` would not run never runs under `coverage`; watch skips, the whole-tree fallbacks and `inert_paths` act as under `diff`.",
        "D1: a `coverage` call with explicit targets, `tree_scope`'s included, runs those targets un-narrowed.",
        "D1: the template's `darn-write`, `webster-fix` and `code-burler-fix` keys hold `scope: coverage` and `pr-review` holds `scope: diff`.",
        "Review: D1's template comment on the gate keys names `coverage` and which keys default to it.",
        "D3: a changed package runs every test of the tier; an importing package runs at least the D3 union\nand nothing outside it but D6's same-name overlap and D6's over-budget whole run.",
        "D3: an importing package's guard test, out-of-process test and test absent from its map, each of the tier and not named by the watch skip,\nrun even when D4 selects nothing.",
        "D3: an importing package with no test in the D3 union and no miss runs no test.",
        "D3: an importing package whose only union member is an unwatched watch-marked guard test runs no test, and the gate passes.",
        "D3: an importing package whose only unrecorded declared test sits in a test file constrained to another GOOS runs no test,\nand the gate passes.",
        "D6: a selected-test pass leaves a green entry carrying its `-run` arguments, which a later gate never reads as the package passed or the tier whole.",
        "D6: an over-budget selected pattern runs the selected packages whole.",
        "D6: a failing selected test is rerun by the failed-test rerun and stops the gate under `--stop-on-fail`.",
        "D7: the scope output lists each package with `changed`, `whole: lym binary`, `miss: <reason>`, `whole: over budget`,\n`selected <n> of <m>` or `none selected`.",
        "D8: an unreadable map file runs that package whole; computing a scope starts no testmap build."
      ],
      "pattern_changes": [],
      "expected_cost_usd": 7.78,
      "cost_line": "darn/solid stored-record fit, $4.06 fixed + $0.38 per 100 lines over 6 runs (r 0.64), at about 980 changed lines"
    }
  ],
