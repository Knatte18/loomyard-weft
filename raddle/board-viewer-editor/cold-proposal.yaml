no edit control at `file://`, shows the `lym board rerender` line when the data is missing at `file://`,\nand retries a failed request before showing the `lym board open` line.","D5: `lym board open` run from a worktree's anchored directory, with the server's lock held by a live server, starts no server and hands the opener seam a launcher path under the server's state directory.","D5: an `open` during a starting server's build, with the lock held and the previous server's state file left, hands over the new server's address;\nan `open` while a server drains on exit starts a fresh server.","D5: `open` run from a task pair's worktree starts a server whose working directory is the prime's anchored directory.","D5: the envelope's address holds no token.","D5: with the lock held and no state that answers, `open` refuses naming the server log, and starts nothing.","D5: with a strand name set, the keep-warm cap injected, and an opener that does not exit, `open` returns success at the cap.","D5: `lym board open` with the lock free starts a server even when a leftover state file names a port, waits for the new server to answer with its token, and then hands the opener the launcher; with a server that never answers it refuses naming the server log.","D5: `lym board open` under `--board-path` refuses naming a run from a worktree of the hub, and starts no process.","D5: an opener that fails surfaces its error naming the opener.","D6: seeding the prime, a beam and a task pair each writes `reed attach` and `board open` into the worktree's `tasks.json`, and none of them writes `beam start` there.","D6: the `board open` task's presentation sets `\"reveal\": \"always\"` and `\"focus\": false`.","D6: the hub workspace file holds one `beam start` task running `lym beam start root`, and a beam's workspace file holds one running `lym beam start <beam>`.","D6: a regeneration with no workspace-content hook installed writes workspace files with no `tasks` key.","D6: a regeneration whose hook returns a member named `lym.generated`, `folders` or `settings` returns an error and writes no workspace file.","D6: the keybindings block holds `alt+shift+0` running `beam start` and `alt+shift+9` running `board open`, and a second seed leaves exactly one of each.","D8: an edit carrying the entry's current revision is saved; one carrying an older revision, including one older only by a status change, is refused with the fresh entry, and `board.json`, the README and the Bolt's git state are unchanged.","D8: on a `board.json` holding an entry the load migrations change, the revision the server's projection gives that entry is accepted by an edit.","D8: an edit carrying the revision a successful write returned is saved.","D8: an edit of an entry another write removed is refused as stale with no entry; a create of an existing slug is refused with the existing entry.","D8: the existing CLI write verbs behave as before, with no revision.","D9: a request whose `Host` is not `127.0.0.1:<port>`, an `/api` request without the token or with a wrong one, a write without `Content-Type: application/json`, a write whose `Origin` is another origin, and a body above the cap are each refused and change nothing.","D9: no response carries an `Access-Control-Allow-Origin` header; every response carries `Cache-Control: no-store` and `X-Content-Type-Options: nosniff`; the page's `Content-Security-Policy` holds no `'unsafe-inline'`.","D9: `GET /file/<name>` without `t` or with a wrong `t` is refused and serves nothing.","D9: the state file and the launcher are readable by the user alone, on Windows each file's DACL grants only the owner,\nthe launcher's address uses `127.0.0.1`, and the opener's argument holds no token.","D10: each operation, create, edit, release, promote, draft and undraft, applied through `POST /api/write` leaves `board.json`, its date stamps aside, as the matching CLI verb leaves it, and answers with the fresh projection.","D10: draft of a task whose status is not none, and undraft of a task whose status is not `draft`, are refused and change nothing.","D10: release of a task in a run status is refused naming `lym board set-status`, and changes nothing.","D10: Review: the page shows the create form and the edit form, offers only the release, promote, draft and undraft actions an entry's kind and status allow,\nand on a stale refusal shows the fresh entry beside the unsent edit, which stays in its form.","D10: an edit of a running task's scope through the server is refused with the run lock's message, as the CLI refuses it.","D10: `GET /api/board` with the current board revision returns once another writer changes `board.json`, with the new projection; with no change it answers \"unchanged\" at its bound.","D10: `GET /file/<name>` serves a name the projection lists and answers not found for any other, a path with a separator included.","D11: a second `lym board serve` for the same hub exits at once with success after its lock wait while the first holds the lock; `lym board serve` under `--board-path` refuses.","D11: the server exits when no `/api` request arrives within its idle bound, and when its binary is replaced, using an injected clock and replacement check, and a write in flight at that moment completes.","D11: with the file watch unavailable, a change to `board.json` still wakes a waiting `GET /api/board` through the timer.","D12: `lym board open` and `lym board serve` with a run agent's strand name refuse and start nothing; with an orch's strand name or none they proceed.","D13: Review: the HTTP server, its checks, its state and its watch loop live in `internal/boardserve` (new), which writes the board only through `boardengine`'s exported methods."],
