        "delivers": "the one-repository layout of D1 to D4: a records store of the code store's origin wired as a weft, its refs under refs/lym/heads/ and refs/lym/tags/ through its refspecs, the board on the fixed branch main, the prime's records branch in lym.primeRecordsBranch; the layout read from the records store's fetch refspec, cached per existing store; a ref namespace passed to every records-store remote operation in gitrepo and fabric; lym fabric clone with one URL and with --single-repo, its ls-remote refusals and its ordered, leased seed push with teardown; hubforge's one-repository builder and the layout's tests; README.md and docs/getting-started.md describing the layout and its hazards; PATTERN-single-repo-hub rewritten, and the one-repository paragraphs of PATTERN-fabric-boundary, PATTERN-lym-files and PATTERN-pair-remote dropped",
        "exports": "fabric's namespace and layout constants (refs/lym/, heads/, tags/, the board branch main, the lym.primeRecordsBranch key); the namespace parameter on gitrepo's push, lease, push-result, upstream-write and remote-delete operations; lym fabric clone --single-repo; hubforge's one-repository builder"
      },
      "depends_on": ["single-repo-code-records-removal"],
      "open_risks": [
        "The parent project `single-repo-hub` is titled for records on each code branch and the board on `lym-bolt`, which this design replaces;\nthe parent may retitle it."
      ],
      "criteria": [
        "D1, D3: `lym fabric clone --single-repo` over a bare origin with no namespace puts the board and the prime's records branch\nunder `refs/lym/heads/`, leaves every `refs/heads/` ref at its prior tip, and builds a hub whose layout matches a two-repository hub's:\nthe records sibling, `_lym` junctions and `_bolt`.",
        "D1: a default `git clone` of that origin fetches no ref under `refs/lym/`, and the hub's records store holds no code branch.",
        "D3: a one-URL clone of an origin holding the namespace builds the same layout on a second machine, with the board's content.",
        "D1, D3: a `--single-repo` clone of an origin whose code default branch is `master` puts the board at `refs/lym/heads/main`\nand the prime's records branch at `refs/lym/heads/master-weft`;\na one-URL clone of that origin on a second machine checks out that board with its content;\nand the orphan sweep in that hub keeps `master-weft`, also after `lym fabric checkout` moves the prime off `master`.",
        "D3: a one-URL clone refuses an origin holding the namespaced board branch with `--single-repo`,\nan origin whose default branch holds `.lym-warp` with `--single-repo`, a second URL with `--single-repo`,\nan origin holding `lym-bolt`, and with `--single-repo` an origin whose default branch tracks a root `.lym-anchor` or `_lym`,\neach before creating anything and each naming its way forward.",
        "D3: a one-URL clone of a two-repository weft whose board tracks the legacy root `.lym-anchor` clones as today.",
        "D3: a seed push that fails leaves no hub directory, names its cause, and leaves no namespaced board branch on origin;\na rerun of `--single-repo`, with the same or another `--subpath`, replaces the leftover records branch and succeeds.",
        "D3: a `--single-repo` clone whose board push loses its lease returns the records branch to the tip it observed,\nand names the one-URL clone of the other hub as its way forward.",
        "D2, D4: in a one-repository hub, a pair add, push and teardown place its records branch at `refs/lym/heads/<branch>-weft`\nand its archive tag under `refs/lym/tags/archive/`, add no ref under `refs/heads/` or `refs/tags/` beyond the code branch,\nand teardown removes the namespaced records branch.",
        "D4: in either layout, a teardown of a never-pushed records branch records no remote deletion.",
        "D2, D4: in a one-repository hub, origin reconcile and remote cleanup in the records store see the namespaced records branches\nand archive tags, and no code branch.",
        "D2: a records branch's upstream in a one-repository hub names its namespaced ref, and the branch reads as in sync after a push.",
        "D2: the layout read of a path with no records store logs nothing and reads two repositories;\na second read of an existing store in the same process runs no git;\na store created after a missing-store read reads one repository.",
