    {
      "slug": "orch-autonomy-mode",
      "title": "Autonomy mode: the parent orch settles every halt, operator only for severe halts and the beam merge",
      "type": "feature",
      "labels": ["dobby", "config", "orch", "loom", "landing", "burler", "drift", "shed", "batten", "webster", "pawl", "workspaces", "slack", "stencil", "heddle"],
