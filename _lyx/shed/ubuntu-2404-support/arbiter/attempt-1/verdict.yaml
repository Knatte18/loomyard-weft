reason: >-
  The refused command, `git help -m cherry-pick | col -b | grep ...`, is read-only: `git help -m` only shows a man page.
  The refusal is a false positive in the burler guard.
  `mutatingGitPattern` in internal/burlerengine/cluster.go (lines 24-26) lets any run of tokens come between `git` and a listed word, so `git help cherry-pick`, `git grep cherry-pick` or `git log -S tag` all count as mutating.
  The fork transcript agent-a2dfed49a3f9fd78e.jsonl shows the reviewer ran `git help -m cherry-pick` twice to check decision D2's claim that `cherry-pick --empty` is newer than git 2.43.
  D2 is at the centre of this task, so a re-run of the same review round is likely to check that claim with a git call that names cherry-pick again and fail the same way.
  A plain re-launch is therefore not safe to rely on, and no goto target avoids the review row.
  Fixing the guard is outside this task's scope, which is Ubuntu 24.04 support.
  The guard also runs from the installed prod lyx, so a fix made inside this run would not take effect until the operator deploys.
  The arbiter has no verb that settles this.
