slots: 3 # how many gate builds and test runs the hub executes at once; a lowered count takes effect on the next acquire while a running holder finishes
scoper: go
refuse_raw: ["go test"]
tiers:
  tier0:
    about: untagged tests
    command: "go test -json -tags tier0 {targets} {args}"
    all_targets: ./...
    env: {GOFLAGS: "-trimpath -p={parallel}"}
    counter: go-json
    parallel: 4
    timeout_min: 10
  tier1:
    about: integration tests with build and vet under each tag first
    command: "go build ./... && go vet -tags tier0 {targets} && go vet -tags tier1,integration {targets} && go vet -tags tier2,tmux {targets} && go vet -tags tier3,llm {targets} && go test -json -tags tier1,integration {targets} {args}"
    all_targets: ./...
    env: {GOFLAGS: "-trimpath -p={parallel}"}
    counter: go-json
    parallel: 4
    timeout_min: 30
    prebuilt_lyx: true
  tier2:
    about: tmux tests
    command: "go test -json -tags tier2,tmux {targets} {args}"
    all_targets: ./...
    env: {GOFLAGS: "-trimpath -p={parallel}"}
    counter: go-json
    parallel: 4
    timeout_min: 30
    prebuilt_lyx: true
  tier3:
    about: llm tests run by hand only
    command: "go test -json -tags tier3,llm {targets} {args}"
    all_targets: ./...
    env: {GOFLAGS: "-trimpath -p={parallel}"}
    counter: go-json
    parallel: 1
    timeout_min: 60
    prebuilt_lyx: true
    manual: true
gates:
  batch: {tiers: [0, 1], scope: card}
  webster-fix: {tiers: [0, 1], scope: diff}
  webster: {tiers: [0, 1, 2], scope: all}
  merge-in: {tiers: [0, 1, 2], scope: all}
  finalize: {tiers: [0, 1, 2], scope: all}
  darn-write: {tiers: [0, 1, 2], scope: diff}
  code-burler-fix: {tiers: [0, 1, 2], scope: diff}
