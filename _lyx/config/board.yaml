readme: ${env:LYX_README:-README.md} # readme page file name; relative to board dir
design_prefix: ${env:LYX_DESIGN_PREFIX:-design-} # prefix for design-doc files
types: # type labels with their descriptions: a note carries exactly one, a task one or more
    audit: a measurement, bench or study run by an orch agent, never a loom task
    bug: lyx does something wrong
    enhancement: something lyx already does gets cheaper, clearer or sturdier, with no new capability
    feature: lyx gains something it cannot do today
labels:
    board: the task tracker, lyx board
    config: config files under _lyx/config and their loading
    ide: VS Code integration, lyx ide
    reed: the tmux server, sessions and strands
    fabric: warp/weft pairs and their git verbs
    selfreport: anomalies lyx files about itself
    shuttle: launching and driving agent sessions
    burler: review rounds
    webster: plan execution by cards and batches
    stencil: prompt templates for spawned roles
    loom: the task recipe from Discussion to Finalize
    quarry: the code index and glyphs
    batten: the outer run lifecycle around a loom
    shed: the phase machine, its recipes and drivers
    orch: the hub orchestrator session
    creel: the message layer every agent, program and operator uses to reach an agent
    claude: the Claude Code engine, shuttleengine/claudeengine and its config
    codex: the Codex CLI engine and its config
    report: 'lyx report: read-only reports over the hub records and history (internal/reportengine)'
    workspaces: 'umbrella tasks: project worktrees with their own orch thread, VS Code workspaces and pairs under them'
    deploy: update-plugins.sh, deploy-dev and the prod pointer (tools/deploy)
    dotnet: 'support for .NET/C# hubs: gate, verify tiers, scoping and baselines for a C# repository such as NORCE Models'
